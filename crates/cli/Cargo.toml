[package]
name = "nickmare-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Binaire final de l'outil : il s'appelle `nickmare` (cf. docs/ARCHITECTURE.md §6).
[[bin]]
name = "nickmare"
path = "src/main.rs"

[dependencies]
# Logique métier pure (scope, modèle). Le binaire orchestre et affiche.
nickmare-core = { path = "../core" }
# Vue carte textuelle de la NetworkMap (issue #9) : rendu lisible pour `map`.
nickmare-net = { path = "../net" }
# Horloge (`Utc::now()`) pour la validation temporelle au moment de l'appel.
chrono = "0.4.38"
# Désérialisation de la carte réseau (NetworkMap) pour `nickmare map <carte.json>`.
# Même version que `core` (MSRV 1.83, sans Cargo.lock).
serde_json = "1.0.128"
