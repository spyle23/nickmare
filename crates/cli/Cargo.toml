[package]
name = "nickmare-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Lints de sûreté partagés (issue #27) : interdit unwrap/expect/panic! sur les
# chemins d'exécution (cf. [workspace.lints.clippy] + clippy.toml).
[lints]
workspace = true

# Binaire final de l'outil : il s'appelle `nickmare` (cf. docs/ARCHITECTURE.md §6).
[[bin]]
name = "nickmare"
path = "src/main.rs"

[dependencies]
# Logique métier pure (scope, modèle). Le binaire orchestre et affiche.
nickmare-core = { path = "../core" }
# Vue carte textuelle de la NetworkMap (issue #9) : rendu lisible pour `map`.
nickmare-net = { path = "../net" }
# État persistant SQLite d'un engagement (issue #26, §11.2) : support de
# `nickmare resume <engagement>`.
nickmare-store = { path = "../store" }
# Socle de rapport N1 (issue #16, §9 Phase 5) : `nickmare report --format
# html|json` lit l'état d'engagement via le trait `EngagementStore` (implémenté
# par `SqliteStore`) et rend HTML/JSON. Pur, sans I/O réseau.
nickmare-report = { path = "../report" }
# Horloge (`Utc::now()`) pour la validation temporelle au moment de l'appel.
chrono = "0.4.38"
# Désérialisation de la carte réseau (NetworkMap) pour `nickmare map <carte.json>`.
# Même version que `core` (MSRV 1.83, sans Cargo.lock).
serde_json = "1.0.128"
# Runtime pour piloter le scan de ports asynchrone (`nickmare scan ports`, #12) :
# on construit un petit runtime `current_thread` et on `block_on` l'orchestration
# `net::portscan::scan_gated`. tokio figé (=1.40.0) comme `core`/`net` : versions
# récentes > MSRV de la toolchain épinglée (1.83). On n'active que `rt`/`time`
# (sleep de cadence + spawn_blocking des sondes), jamais la feature `net`.
tokio = { version = "=1.40.0", features = ["rt", "time", "macros"] }
