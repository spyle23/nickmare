[package]
name = "nickmare-emulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Lints de sûreté partagés (issue #27) : interdit unwrap/expect/panic! sur les
# chemins d'exécution (cf. [workspace.lints.clippy] + clippy.toml).
[lints]
workspace = true

[dependencies]
# Gate (le « mur », §3.2/§4), audit chaîné (traçage N4 en clair), modèle
# (`AttackExecution`/`AdversaryProfile`/`DetectionVerdict`) et config de scope
# (`Emulation.attack_techniques`/`blue_team_contact`) : le crate **orchestre et
# trace** ces briques pures, il ne réimplémente aucun garde-fou — la whitelist de
# techniques reste l'affaire exclusive de `core::gate` (issue #22, §11.3).
nickmare-core = { path = "../core" }

# Trait de moteur d'émulation **asynchrone et objet-sûr** (`&dyn EmulationEngine`),
# comme `ExploitEngine`/`CrackEngine`. Même version que `core` (MSRV 1.83, sans
# Cargo.lock).
async-trait = "0.1.83"

# Mapping **statique JSON** des techniques ATT&CK (parsing du catalogue embarqué)
# et export de la matrice de couverture en JSON (US-G2). Mêmes versions que `core`.
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

# Horodatage opérateur des exécutions (`performed_at`) et calcul du **MTTD**
# (`detected_at - performed_at`) : `attack.rs`/`verdict.rs` nomment `DateTime<Utc>`
# et `TimeDelta` hors tests. Même version que `core` (MSRV 1.83, sans Cargo.lock).
chrono = { version = "0.4.38", features = ["serde"] }

[dev-dependencies]
# Runtime des tests asynchrones (moteur mock + orchestration gate). tokio figé
# (=) comme partout (MSRV 1.83), features minimales, AUCUNE I/O réseau.
tokio = { version = "=1.40.0", features = ["macros", "rt"] }
