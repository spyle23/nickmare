[package]
name = "nickmare-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Lints de sûreté partagés (issue #27) : interdit unwrap/expect/panic! sur les
# chemins d'exécution (cf. [workspace.lints.clippy] + clippy.toml).
[lints]
workspace = true

[dependencies]
# Modèle partagé (NetworkMap, Host, Finding, Severity…) et trait d'état
# d'engagement (EngagementStore) : le rapport agrège ces types purs et lit l'état
# d'un engagement via le même trait que `nickmare-store` (SqliteStore). On ne
# dépend PAS de `nickmare-store` lui-même (ni de rusqlite/tokio) : le rapport est
# pur et testable par mock (InMemoryStore de `core`), le binaire `nickmare`
# branchant le store réel. Les types N2/N3/N4 consommés par le rapport consolidé
# (`ExploitAttempt`, `CrackResult`, `AttackExecution`) sont eux aussi des types
# **purs** de `core` : le rapport n'exécute aucune technique, il restitue.
nickmare-core = { path = "../core" }

# Matrice de couverture ATT&CK + MTTD (issue #23, N4) : on **réutilise**
# `CoverageMatrix`/`DetectionStats`/`compare_profiles` et le `TechniqueCatalog`
# embarqué de `nickmare-emulation` plutôt que de réimplémenter la corrélation
# technique → verdict → MTTD. `emulation` ne dépend que de `core` (comme `report`)
# : aucun cycle, et aucune nouvelle dépendance tierce pour le workspace (serde,
# serde_json, chrono, async-trait sont déjà vendus et audités par deny/audit).
# C'est de la **restitution** : le rapport consomme des `AttackExecution` déjà
# tracées, il ne pilote aucun moteur d'émulation.
nickmare-emulation = { path = "../emulation" }

# Rendu HTML par templates **compilés et typés** (US-H1). Version figée (=) comme
# le reste de l'arbre : la toolchain est épinglée à 1.83 (rust-toolchain.toml) et
# le dépôt n'a PAS de Cargo.lock. askama 0.12.1 est la dernière de la ligne 0.12,
# restée en edition 2021 avec un arbre transitif léger — askama_derive 0.12.5
# (nom 7, proc-macro2/quote/syn 2), askama_escape 0.10.3 — tous parseables et
# compilables par cargo 1.83, contrairement aux lignes 0.13+ qui relèvent le MSRV.
# `default-features = false` : on n'active ni le parsing d'askama.toml (`config`),
# ni les filtres optionnels (`humansize`/`num-traits`/`urlencode`) — on n'a besoin
# que du trait `Template`, du dérive et de l'échappement HTML automatique (actif
# d'office pour l'extension .html, garde-fou anti-injection des bannières/noms).
askama = { version = "=0.12.1", default-features = false }

# Export JSON complet (US-H2) + (dé)sérialisation du modèle de rapport. Mêmes
# versions que `core` (MSRV 1.83, sans Cargo.lock). La feature `serde` de chrono
# fournit la (dé)sérialisation des horodatages d'opérations et du rapport.
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
chrono = { version = "0.4.38", features = ["serde"] }

[dev-dependencies]
# Garde-fou de masquage (issue #23, N3) : le test de non-fuite fait transiter un
# clair craqué par le **vrai** chemin de `crates/crack` — `MaskedSecret` +
# `CrackReport::to_crack_result` — pour prouver que le `CrackResult` restitué par
# le rapport (HTML ET JSON) n'expose aucun secret en clair. En test seulement :
# le rapport lui-même ne dépend PAS de `nickmare-crack`, il ne consomme que le
# `CrackResult` (statistiques, déjà masqué par construction) de `core`.
nickmare-crack = { path = "../crack" }
