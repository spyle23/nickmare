[package]
name = "nickmare-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
chrono = { version = "0.4.38", features = ["serde"] }
async-trait = "0.1.83"
# Hachage du journal d'audit chaîné (issue #5, §3.3) et empreinte SHA-256 du
# scope (issue #3) : SHA-256 pour le chaînage d'intégrité et le hash de scope.
# Brique cryptographique éprouvée (RustCrypto) plutôt qu'une implémentation
# maison — la ligne 0.10 reste compatible MSRV 1.83.
sha2 = "0.10.8"

# Scope (issue #3) : désérialisation TOML et signature ed25519.
#
# basic-toml (et non `toml`) : parseur TOML serde minimaliste, sans la pile
# toml_edit → indexmap → hashbrown. hashbrown récent exige la feature Cargo
# `edition2024` (rustc ≥ 1.85), incompatible avec la toolchain épinglée 1.83 et
# l'absence de Cargo.lock. basic-toml ne dépend que de serde → arbre MSRV sûr.
basic-toml = "0.1"
# ed25519-dalek figé (=) : la toolchain est épinglée à 1.83 (rust-toolchain.toml)
# et le dépôt n'a pas de Cargo.lock ; on fige la version de vérification de
# signature à un arbre connu compatible 1.83 pour un build reproductible.
ed25519-dalek = "=2.1.1"

# tokio figé (=) : les versions récentes relèvent leur MSRV au-dessus de la
# toolchain épinglée (rust-toolchain.toml = 1.83). 1.40 reste compatible. En
# dev-dependency seulement : runtime des tests, aucune I/O réseau.
[dev-dependencies]
tokio = { version = "=1.40.0", features = ["macros", "rt"] }
