# Workspace Cargo de Nickmare (issue #1, cf. docs/ARCHITECTURE.md §6).
#
# Les crates sont vides mais compilables au départ : chaque phase de la roadmap
# (Phase 0 → Phase 9) les remplit de façon incrémentale. Aucune dépendance
# externe n'est tirée tant qu'une crate n'en a pas besoin, pour garder la CI
# rapide pendant la phase de fondations.

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/net",
    "crates/cve",
    "crates/exploit",
    "crates/crack",
    "crates/emulation",
    "crates/report",
    "crates/cli",
    "crates/sectests",
]
# Le crate `fuzz/` (cargo-fuzz) est volontairement HORS workspace (issue #28,
# §10.4) : il exige le toolchain **nightly** + libFuzzer, incompatibles avec le
# pin MSRV 1.83 stable et l'absence de Cargo.lock. Exclu d'office (membres listés
# explicitement), on le rend explicite pour qu'aucun `cargo *--workspace` (ni
# `generate-lockfile` → audit/deny) ne le résolve. Il tourne dans un job CI
# nightly dédié (.github/workflows/fuzz.yml), jamais dans la CI de PR bloquante.
exclude = ["fuzz"]

# Métadonnées partagées, héritées par chaque crate via `*.workspace = true`.
[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
repository = "https://github.com/spyle23/nickmare"
# Outil interne d'engagement, jamais publié sur crates.io (§12 — réduire la
# surface : on ne pousse pas par accident un outil offensif sur un registre
# public). Hérité par chaque crate via `publish.workspace = true`. Permet aussi à
# `cargo deny` d'ignorer ces crates « privées » qui n'ont pas encore de licence
# déclarée (README : « LICENSE à définir »), via `[licenses] private.ignore`.
publish = false

# Lints de sûreté partagés (issue #27, §11.4 & §12) : hérités par chaque crate
# via `[lints] workspace = true`. On interdit `unwrap`/`expect`/`panic!` sur les
# chemins d'exécution — une entrée réseau hostile ne doit jamais faire paniquer
# l'outil, les erreurs remontent via `Result`. Les usages en test restent permis
# (clippy.toml : allow-{unwrap,expect,panic}-in-tests). Ce sont des lints clippy
# `restriction` (inertes hors `cargo clippy`), donc sans effet sur `cargo build`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
# Binaire d'audit : build optimisé et dépouillé.
strip = true
lto = "thin"
